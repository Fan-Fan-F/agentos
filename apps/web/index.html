<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentOS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310a37f'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='700' text-anchor='middle' fill='white' font-family='Segoe UI,sans-serif'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="logo">A</div>
        <div class="brand-text">
          <div class="brand-name">AgentOS</div>
          <div class="brand-sub">Build once, use every agent.</div>
        </div>
      </div>
      <button class="new-task" id="btnNewTask" title="新建任务">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        新建任务
      </button>
      <nav id="nav">
        <a href="#/tasks" data-view="tasks">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="2" y="2.5" width="12" height="11" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          任务
        </a>
        <a href="#/agents" data-view="agents">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="3" y="5" width="10" height="8" rx="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 2v3M6.5 9.5h.01M9.5 9.5h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Agents
        </a>
        <a href="#/projects" data-view="projects">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h2.6l1.4 1.6H12a1.5 1.5 0 0 1 1.5 1.5v4.4A1.5 1.5 0 0 1 12 13H4a1.5 1.5 0 0 1-1.5-1.5v-6Z" stroke="currentColor" stroke-width="1.4"/></svg>
          项目
        </a>
      </nav>
      <div class="recents" id="recents">
        <div class="recents-title">最近任务</div>
        <div id="recentsList" class="recents-list"></div>
      </div>
      <div class="sidebar-foot">
        <button class="foot-btn" id="btnSettings" title="设置">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          设置
        </button>
        <span class="foot-version" id="version">v0.3.0</span>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <h1 id="pageTitle">任务</h1>
        <div id="topbarExtra" class="topbar-extra"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- 设置弹层 -->
  <div class="modal-mask hidden" id="settingsModal">
    <div class="modal">
      <div class="modal-head"><h2>设置</h2><button class="icon-btn" data-close="settingsModal">✕</button></div>
      <div class="modal-body">
        <label class="field-label">主题</label>
        <div class="segmented" id="themeSeg">
          <button data-theme="system">跟随系统</button>
          <button data-theme="light">浅色</button>
          <button data-theme="dark">深色</button>
        </div>
        <label class="field-label">默认 Agent（新建任务时自动路由的偏好）</label>
        <select id="setDefaultAgent" class="input"><option value="">Auto（自动路由）</option></select>
        <div class="meta-card" id="metaCard"></div>
      </div>
    </div>
  </div>

  <!-- 确认弹层 -->
  <div class="modal-mask hidden" id="confirmModal">
    <div class="modal modal-sm">
      <div class="modal-body">
        <p id="confirmText" style="margin:6px 0 18px;font-size:14px"></p>
        <div class="row end">
          <button class="btn" data-close="confirmModal">取消</button>
          <button class="btn btn-danger" id="confirmOk">确认删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 首次使用向导 -->
  <div class="onboard-mask hidden" id="onboarding">
    <div class="onboard-card">
      <div class="onboard-dots" id="onboardDots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
      <div id="onboardBody"></div>
      <div class="row end onboard-foot">
        <button class="btn" id="onboardSkip">跳过</button>
        <button class="btn btn-primary" id="onboardNext">开始</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>
  <script src="./app.js"></script>
</body>
</html>
